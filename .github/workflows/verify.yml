name: Verify retail
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: '1433'
      DB_USER: sa
      DB_TRUST_SERVER_CERTIFICATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm test && npm run sql:check && npm run frontend:build
      - run: npm audit --prefix backend && npm audit --prefix frontend
      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          password="Test_$(openssl rand -hex 20)!"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name retail-ci --memory=3g -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..60}; do
            if docker exec retail-ci /bin/bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs retail-ci
          exit 1
      - run: npm run test:integration
      - if: always()
        run: docker rm -f retail-ci || true
