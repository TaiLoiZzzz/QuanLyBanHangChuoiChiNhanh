services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_dbms_cothe
    # Preserve the OS user used by existing project volumes.
    user: root
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD (use --env-file backend/.env)}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${DB_PORT:-11433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  sqlserver_data:
